name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.2.6 scipy==1.17.1 pandas==2.3.3 matplotlib==3.11.1 pytest==9.1.1
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests
        run: python -m pytest -q
      - name: Smoke run of every experiment
        run: python experiments/run_all.py --quick --device cpu
